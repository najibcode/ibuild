<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0D2563"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container Tile -->
  <rect x="24" y="24" width="464" height="464" rx="105" ry="105" fill="url(#iconBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="105" ry="105" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Left Column -->
  <rect x="102" y="235" width="92" height="174" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
  <!-- Left Windows -->
  <rect x="127" y="275" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="127" y="325" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>

  <!-- Center Tallest Column -->
  <rect x="210" y="122" width="92" height="287" rx="14" fill="#FFFFFF"/>
  <!-- Center Apex Crown -->
  <polygon points="256,86 316,128 196,128" fill="url(#emeraldGrad)"/>
  <!-- Center Windows -->
  <rect x="235" y="172" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="235" y="222" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="235" y="272" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="235" y="322" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>

  <!-- Right Column -->
  <rect x="318" y="184" width="92" height="225" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
  <!-- Right Windows -->
  <rect x="343" y="225" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="343" y="275" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>
  <rect x="343" y="325" width="42" height="18" rx="5" fill="#1E40AF" fill-opacity="0.3"/>

  <!-- Solid Foundation Base Line -->
  <line x1="76" y1="435" x2="436" y2="435" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
</svg>
