  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#favBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- 'i' Dot -->
