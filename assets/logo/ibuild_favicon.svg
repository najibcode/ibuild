<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0D2563"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#favBg)"/>

  <!-- Left Column -->
  <rect x="13" y="30" width="11" height="21" rx="2" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- Center Tallest Column -->
  <rect x="26.5" y="16" width="11" height="35" rx="2" fill="#FFFFFF"/>
  <!-- Center Apex Crown -->
  <polygon points="32,11 39.5,16.5 24.5,16.5" fill="url(#emeraldGrad)"/>

  <!-- Right Column -->
  <rect x="40" y="23" width="11" height="28" rx="2" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- Base Line -->
  <line x1="10" y1="54" x2="54" y2="54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
