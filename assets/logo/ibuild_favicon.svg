<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0D2563"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Left Column -->
  <rect x="6" y="15" width="6" height="11" rx="1" ry="1" fill="white" opacity="0.82"/>

  <!-- Center Column -->
  <rect x="13" y="7" width="6" height="19" rx="1" ry="1" fill="white"/>

  <!-- Right Column -->
  <rect x="20" y="11" width="6" height="15" rx="1" ry="1" fill="white" opacity="0.82"/>

  <!-- Emerald Chevron -->
  <polygon points="16,4 20,7.5 12,7.5" fill="#059669"/>

  <!-- Foundation Base -->
  <line x1="5" y1="28" x2="27" y2="28" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
