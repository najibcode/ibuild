<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="iconbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0D2563"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark (scaled to 100×100 within 120 tall canvas) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#iconbg)"/>

    <!-- Left Column -->
    <rect x="20" y="48" width="18" height="34" rx="2.5" ry="2.5" fill="white" opacity="0.82"/>
    <!-- Center Column -->
    <rect x="42" y="22" width="18" height="60" rx="2.5" ry="2.5" fill="white"/>
    <!-- Right Column -->
    <rect x="64" y="36" width="18" height="46" rx="2.5" ry="2.5" fill="white" opacity="0.82"/>
    <!-- Chevron -->
    <polygon points="51,16 63,24 39,24" fill="#059669"/>
    <!-- Base -->
    <line x1="16" y1="86" x2="84" y2="86" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="62" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#1E40AF" letter-spacing="1">I</text>
  <text x="157" y="62" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0F172A" letter-spacing="1">BUILD</text>

  <!-- Subtitle -->
  <text x="132" y="85" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="4">ERP ENTERPRISE</text>
</svg>
