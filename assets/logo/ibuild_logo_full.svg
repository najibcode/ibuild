<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="tiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Container (Squircle) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="url(#logoBg)"/>
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- 'i' Dot -->
    <polygon points="32,26 40,21 48,26 40,31" fill="#93C5FD"/>
    <polygon points="32,26 40,31 40,39 32,34" fill="#3B82F6"/>
    <polygon points="40,31 48,26 48,34 40,39" fill="#1D4ED8"/>

    <!-- 'i' Pillar -->
    <polygon points="32,43 40,38 48,43 40,48" fill="#93C5FD"/>
    <polygon points="32,43 40,48 40,75 32,70" fill="url(#cobaltGrad)"/>
    <polygon points="40,48 48,43 48,70 40,75" fill="#1E40AF"/>

    <!-- Center Spire -->
    <polygon points="48,18 56,13 64,18 56,23" fill="#BFDBFE"/>
    <polygon points="48,18 56,23 56,82 48,77" fill="url(#cobaltGrad)"/>
    <polygon points="56,23 64,18 64,77 56,82" fill="#172554"/>

    <!-- 'B' Titanium Structure with Emerald Glow -->
    <polygon points="40,34 52,27 75,41 63,48" fill="url(#tiGrad)"/>
    <polygon points="40,34 63,48 63,58 40,44" fill="#64748B"/>
    <polygon points="64,43 72,39 72,46 64,50" fill="#10B981"/>
    <polygon points="58,51 77,40 77,69 68,74 68,60 58,64" fill="#334155"/>
    <polygon points="58,64 68,60 77,66 68,70" fill="url(#tiGrad)"/>
    <polygon points="69,61 75,58 75,65 69,68" fill="#10B981"/>
  </g>

  <!-- Wordmark & Subtitle -->
  <text x="132" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="#FFFFFF">IBU<tspan fill="url(#textGrad)">ILD</tspan></text>
  <text x="134" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Outfit', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#94A3B8">CONSTRUCTION ERP</text>
</svg>
