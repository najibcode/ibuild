<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Clean Squircle Tile -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="url(#fullBg)"/>
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Left 'i' -->
    <rect x="18" y="18" width="15" height="15" rx="4" fill="url(#emeraldGrad)"/>
    <rect x="18" y="38" width="15" height="44" rx="4" fill="url(#cobaltGrad)"/>

    <!-- Right 'B' -->
    <path d="M 39 18 L 64 18 A 14 14 0 0 1 78 32 A 14 14 0 0 1 64 46 L 39 46 Z" fill="url(#cobaltGrad)"/>
    <path d="M 49 25 L 63 25 A 7 7 0 0 1 70 32 A 7 7 0 0 1 63 39 L 49 39 Z" fill="#070B18"/>

    <path d="M 39 52 L 64 52 A 15 15 0 0 1 79 67 A 15 15 0 0 1 64 82 L 39 82 Z" fill="url(#emeraldGrad)"/>
    <path d="M 49 60 L 63 60 A 7 7 0 0 1 70 67 A 7 7 0 0 1 63 74 L 49 74 Z" fill="#070B18"/>
  </g>

  <!-- Wordmark Prominently Highlighting IBU -->
  <g transform="translate(130, 24)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#3B82F6">IBU</tspan><tspan fill="#FFFFFF">ILD</tspan>
    </text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#94A3B8">CONSTRUCTION ERP</text>
  </g>
</svg>
